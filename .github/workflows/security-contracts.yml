name: Security contract regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Common.Security
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: 4f90c9fd31aaa16ffbada97e33084a5356a45859
          path: Common.Diagnostics
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Common.Security/Common.Security.UnitTests/Common.Security.UnitTests.csproj -c Release --logger trx --results-directory TestResults
      - run: dotnet build Common.Security/Common.Security.Tools/Common.Security.Tools.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: TestResults
